- name: Install Node Exporter
  hosts: node_exporter
  become: yes
  vars:
    node_exporter_version: "1.10.2"
    node_exporter_bin: "/usr/local/bin/node_exporter"
    # Deteksi arsitektur secara otomatis
    node_exporter_arch: >-
      {% if ansible_architecture == 'x86_64' %}amd64
      {% elif ansible_architecture == 'aarch64' %}arm64
      {% elif ansible_architecture == 'armv6l' %}armv6
      {% elif ansible_architecture == 'armv7l' %}armv7
      {% elif ansible_architecture in ['i386', 'i686'] %}386
      {% else %}amd64{% endif %}

  tasks:
    - name: Cek apakah systemd tersedia
      stat:
        path: /run/systemd/system
      register: systemd_check

    - name: Cek versi node_exporter yang sudah terinstal
      shell: |
        set -o pipefail
        {{ node_exporter_bin }} --version 2>&1 | head -1 | grep -oP 'version \K[0-9.]+' || echo "not_installed"
      args:
        executable: /bin/bash
      register: installed_version
      changed_when: false
      failed_when: false

    - name: Download Node Exporter tarball (hanya jika versi berbeda)
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"
      when: installed_version.stdout != node_exporter_version

    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes
      when: installed_version.stdout != node_exporter_version

    - name: Copy binary ke /usr/local/bin
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: "{{ node_exporter_bin }}"
        mode: "0755"
        remote_src: yes
      when: installed_version.stdout != node_exporter_version
      notify: Restart node_exporter

    - name: Buat systemd unit file
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=nobody
          ExecStart={{ node_exporter_bin }} --web.listen-address=:9100
          Restart=always

          [Install]
          WantedBy=multi-user.target
      when: systemd_check.stat.exists
      notify:
        - Reload systemd
        - Restart node_exporter

    - name: Pastikan service Node Exporter Running (Systemd)
      systemd:
        name: node_exporter
        state: started
        enabled: yes
      when: systemd_check.stat.exists

    - name: Bersihkan sisa file di /tmp
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/node_exporter.tar.gz"
        - "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
      when: installed_version.stdout != node_exporter_version

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
        enabled: yes
