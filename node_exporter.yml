- name: Auto update Node Exporter
  hosts: node_exporter
  become: yes
  vars:
    node_exporter_bin_path: "/usr/local/bin/node_exporter"

  tasks:
    - name: Cek apakah systemd tersedia
      stat:
        path: /run/systemd/system
      register: systemd_check

    - name: Ambil versi terbaru dari GitHub
      uri:
        url: https://api.github.com/repos/prometheus/node_exporter/releases/latest
        return_content: yes
        headers:
          User-Agent: "Ansible"
      register: release_info
      until: release_info.status == 200
      retries: 3
      delay: 5

    - name: Set versi terbaru
      set_fact:
        node_exporter_version: "{{ release_info.json.tag_name | regex_replace('^v','') }}"

    - name: Download and Unarchive Node Exporter
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: Pindahkan binary ke bin path
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "{{ node_exporter_bin_path }}"
        mode: "0755"
        remote_src: yes
      notify: Restart node_exporter

    - name: Buat systemd unit file
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network.target

          [Service]
          User=nobody
          ExecStart={{ node_exporter_bin_path }} --web.listen-address=:9100
          Restart=always

          [Install]
          WantedBy=multi-user.target
      when: systemd_check.stat.exists
      notify:
        - Reload systemd
        - Restart node_exporter

    - name: Pastikan service berjalan (Systemd)
      systemd:
        name: node_exporter
        state: started
        enabled: yes
      when: systemd_check.stat.exists

    - name: Jalankan node_exporter manual (Non-Systemd)
      shell: "nohup {{ node_exporter_bin_path }} --web.listen-address=:9100 > /dev/null 2>&1 &"
      async: 10
      poll: 0
      when: not systemd_check.stat.exists

    - name: Bersihkan file temporary
      file:
        path: "{{ item }}"
        state: absent
      with_fileglob:
        - "/tmp/node_exporter*"

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
      when: systemd_check.stat.exists
