- name: Install Node Exporter
  hosts: node_exporter
  become: yes
  vars:
    node_exporter_version: "1.10.2"
    node_exporter_bin: "/usr/local/bin/node_exporter"

  tasks:
    - name: Cek apakah systemd tersedia
      stat:
        path: /run/systemd/system
      register: systemd_check

    # -------------------------------------------------------------------
    # Download tarball
    # -------------------------------------------------------------------
    - name: Download Node Exporter tarball
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"
        creates: /tmp/node_exporter.tar.gz
        timeout: 60 # kalau ada jaringan lambat

    # -------------------------------------------------------------------
    # Verifikasi berkas ada / tampilkan ukuran dan mode
    # -------------------------------------------------------------------
    - name: Stat tarball after download
      stat:
        path: /tmp/node_exporter.tar.gz
      register: tarball_info

    - name: Debug info of downloaded tarball
      debug:
        msg: |
          Path: {{ tarball_info.stat.path }}
          Exists: {{ tarball_info.stat.exists }}
          Size: {{ tarball_info.stat.size }} bytes
          Mode: {{ tarball_info.stat.mode }}

    - name: Fail if tarball missing
      fail:
        msg: "Berkas /tmp/node_exporter.tar.gz tidak ditemukan setelah download. Periksa jaringan atau izin."
      when: not tarball_info.stat.exists

    # -------------------------------------------------------------------
    # Ekstraksi
    # -------------------------------------------------------------------
    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        keep_newer: true # hindari overwrite yang tidak diinginkan
