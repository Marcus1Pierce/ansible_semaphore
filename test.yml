- name: Install Node Exporter
  hosts: node_exporter
  become: yes
  vars:
    # Tentukan versi di sini secara manual
    node_exporter_version: "1.10.2"
    node_exporter_bin: "/usr/local/bin/node_exporter"

  tasks:
    - name: Cek apakah systemd tersedia
      stat:
        path: /run/systemd/system
      register: systemd_check

    # Download the tarball (hanya jika belum ada)
    - name: Download Node Exporter tarball
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: "0644"
        creates: /tmp/node_exporter.tar.gz

    # Pastikan file sudah ada sebelum diekstrak
    - name: Verify tarball existence
      stat:
        path: /tmp/node_exporter.tar.gz
      register: tarball_info

    - name: Debug tarball status
      debug:
        msg: |
          Tarball path: {{ tarball_info.stat.path }}
          Exists: {{ tarball_info.stat.exists }}
          Size: {{ tarball_info.stat.size }} bytes
          Perms: {{ tarball_info.stat.mode }}

    # Extract the tarball
    - name: Extract Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes
        creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    # Name the extracted directory without a version string
    - name: Rename extracted directory
      command: mv /tmp/node_exporter-{{ node_exporter_version }}.linux-amd64 /tmp/node_exporter
      args:
        creates: /tmp/node_exporter

    - name: Copy binary ke /usr/local/bin
      copy:
        src: "/tmp/node_exporter/node_exporter"
        dest: "{{ node_exporter_bin }}"
        mode: "0755"
        remote_src: yes
      notify: Restart node_exporter
